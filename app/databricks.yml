bundle:
  name: "icu-step-down"

sync:
  include:
    - .build

artifacts:
  default:
    build: apx build

resources:
  apps:
    icu-step-down-app:
      name: "icu-step-down"
      description: "ICU Step-Down Readiness — clinical decision support"
      source_code_path: ./.build
      resources:
        # Grant the app SP CAN_QUERY on the readiness endpoint.
        # Lakebase postgres access (app.yml postgres resource) is separate:
        # the app SP needs GRANT SELECT ON ALL TABLES IN SCHEMA mimic_iii
        # after first deploy (Phase 7B).  The Lakebase project icu-step-down
        # was provisioned in Phase 4 and is NOT managed by this bundle —
        # no database_instances block here.
        - name: "icu-readiness"
          serving_endpoint:
            name: "icu-readiness"
            permission: "CAN_QUERY"

targets:
  sandbox:
    mode: development
    default: true
    workspace:
      host: https://fe-sandbox-icu-step-down-readiness.cloud.databricks.com
