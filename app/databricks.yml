bundle:
  name: "icu-step-down"

sync:
  include:
    - .build

artifacts:
  default:
    build: apx build

resources:
  database_instances:
    icu-step-down-db:
      name: "icu-step-down"
      capacity: "CU_1"
  apps:
    icu-step-down-app:
      name: "icu-step-down"
      description: "icu-step-down created with apx"
      source_code_path: ./.build
      resources:
        - name: "db"
          database:
            database_name: "databricks_postgres"
            instance_name: ${resources.database_instances.icu-step-down-db.name}
            permission: "CAN_CONNECT_AND_CREATE"

targets:
  dev:
    mode: development
    default: true
