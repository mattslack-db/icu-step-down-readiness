[project]
name = "icu-step-down"
dynamic = ["version"]
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.119.0",
    "pydantic-settings>=2.11.0",
    "uvicorn>=0.37.0",
    "databricks-sdk>=0.74.0", "sqlmodel>=0.0.27", "psycopg[binary,pool]>=3.2.11",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ty>=0.0.12",
]

[tool.apx.metadata]
app-name = "icu-step-down"
app-slug = "icu_step_down"
app-entrypoint = "icu_step_down.backend.app:app"
api-prefix = "/api"
metadata-path = "src/icu_step_down/_metadata.py"

[build-system]
requires = ["hatchling", "uv-dynamic-versioning>=0.7.0"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.uv-dynamic-versioning]
vcs = "git"
fallback-version = "0.0.0"

[tool.hatch.build.hooks.version]
path = "src/icu_step_down/_version.py"
template = '''
version = "{version}"
'''

[tool.hatch.build]
artifacts = ["src/icu_step_down/__dist__", "src/icu_step_down/_metadata.py"]
